<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">白恬虚构角色设定卡 · 非身份证</title>
<desc id="desc">一张原创横向角色资料卡，左侧是白恬的动漫肖像，右侧列出虚构角色尺度与外观设定。不是身份证或其他官方身份凭证。</desc>
