<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧物店里的慢下午 小白龙同志历险记</title><link rel="stylesheet" href="reading.css"></head><body><a class="skip" href="#content">跳到正文</a><header><a class="brand" href="index.html"><img width="42" height="42" src="../site/assets/brand/living-mark-v01.svg" alt="">小白龙同志<span>影像与日常</span></a><a href="../site/index.html">交互版 ↗</a></header><nav><a href="index.html">目录</a><a href="gallery.html">作品</a><a href="memories.html">记忆</a><a href="plans.html">下一轮</a><a href="library.html">创作室</a></nav><main id="content"><h1>旧物店里的慢下午</h1><p>2026年10月22日的创作线索</p><h2>喜欢可以很具体</h2><p>旧相机的旋钮 旧唱片的封面<br>有些东西让她想停下来 多看一会儿</p><p>比起让她一直站在镜头前<br>我们更想拍到 她发现喜欢的东西时 眼神先亮起来的那一刻</p><h2>被拍到的摄影师</h2><p>她也会拿起相机 决定自己想留下什么<br>草地上举起镜头 反而成了另一张照片里的主角</p><p>所以相机在这里既是道具 也是行动的理由<br>唱片店 旧物架 草地 不同的地方可以被同一种好奇心连起来</p><p><em>创作札记 依据2026年10月22日角色日记与既有作品整理</em></p><h2>相关画面</h2><figure><img style="width:100%;height:auto;max-width:600px" loading="lazy" src="../images/generated/N13_粉色裤裙逛旧物店_v01.webp" alt="粉色裤裙逛旧物店"><figcaption>N13 粉色裤裙逛旧物店</figcaption></figure><figure><img style="width:100%;height:auto;max-width:600px" loading="lazy" src="../images/generated/N23_唱片店里的黑裙午后_v02.webp" alt="唱片店里的黑裙午后"><figcaption>N23 唱片店里的黑裙午后</figcaption></figure><figure><img style="width:100%;height:auto;max-width:600px" loading="lazy" src="../images/generated/N71_举起相机反而被拍到了_v01.webp" alt="举起相机反而被拍到了"><figcaption>N71 举起相机反而被拍到了</figcaption></figure></main><footer><p>影像 记忆 共同创作</p><a href="index.html">返回目录</a></footer></body></html>
